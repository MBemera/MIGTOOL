{
  "version": "aaf-v73.1-demo",
  "pages": [
    {
      "id": "entity",
      "title": "Entity details",
      "sections": [
        {
          "id": "entity.core",
          "title": "Entity identification",
          "fields": [
            {
              "path": "entity.legalName",
              "label": "Legal name",
              "type": "text",
              "required": true
            },
            {
              "path": "entity.type",
              "label": "Entity type",
              "type": "select",
              "required": true,
              "options": "lookup:entityTypes"
            },
            {
              "path": "entity.abn",
              "label": "ABN",
              "type": "text",
              "required": true,
              "widget": "abn"
            },
            {
              "path": "entity.email",
              "label": "Contact email",
              "type": "text"
            }
          ]
        },
        {
          "id": "address.core",
          "title": "Registered address",
          "fields": [
            {
              "path": "address.line1",
              "label": "Street address",
              "type": "text",
              "required": true
            },
            {
              "path": "address.suburb",
              "label": "Suburb",
              "type": "text",
              "required": true
            },
            {
              "path": "address.state",
              "label": "State / territory",
              "type": "select",
              "required": true,
              "options": "lookup:states"
            },
            {
              "path": "address.postcode",
              "label": "Postcode",
              "type": "text",
              "required": true
            },
            {
              "path": "address.country",
              "label": "Country",
              "type": "select",
              "required": true,
              "options": "lookup:countries"
            }
          ]
        }
      ]
    },
    {
      "id": "tax",
      "title": "Tax declarations",
      "sections": [
        {
          "id": "tax.core",
          "title": "Customer-supplied declarations",
          "fields": [
            {
              "path": "tax.residency",
              "label": "Tax residency",
              "type": "select",
              "required": true,
              "options": "lookup:countries"
            },
            {
              "path": "tax.foreignTax",
              "label": "Foreign tax resident",
              "type": "boolean"
            },
            {
              "path": "tax.foreignTin",
              "label": "Foreign tax identifier",
              "type": "text",
              "visibleWhen": "tax.foreignTax = true",
              "requiredWhen": "tax.foreignTax = true",
              "declaredBy": "customer"
            },
            {
              "path": "tax.declaration",
              "label": "Declaration evidence reference",
              "type": "document-ref",
              "required": true,
              "declaredBy": "customer"
            }
          ]
        }
      ]
    },
    {
      "id": "accounts",
      "title": "Accounts",
      "sections": [
        {
          "id": "accounts.list",
          "title": "Account registration",
          "fields": [
            {
              "path": "productCode",
              "label": "Product",
              "type": "select",
              "required": true,
              "options": "lookup:products"
            },
            {
              "path": "accountNumber",
              "label": "Source account number",
              "type": "text",
              "required": true
            },
            {
              "path": "bsb",
              "label": "BSB",
              "type": "text",
              "required": true
            },
            {
              "path": "openDate",
              "label": "Opening date",
              "type": "date",
              "required": true
            }
          ],
          "collection": {
            "path": "accounts",
            "min": 1,
            "max": 30
          }
        }
      ]
    },
    {
      "id": "people",
      "title": "People",
      "sections": [
        {
          "id": "people.list",
          "title": "Associated people",
          "fields": [
            {
              "path": "name",
              "label": "Full name",
              "type": "text",
              "required": true
            },
            {
              "path": "dateOfBirth",
              "label": "Date of birth",
              "type": "date"
            },
            {
              "path": "email",
              "label": "Email",
              "type": "text"
            },
            {
              "path": "role",
              "label": "Relationship",
              "type": "select",
              "options": "lookup:relationships",
              "required": true
            }
          ],
          "collection": {
            "path": "people",
            "min": 1,
            "max": 20
          }
        }
      ]
    },
    {
      "id": "signatories",
      "title": "Signatories",
      "sections": [
        {
          "id": "signatories.list",
          "title": "Signing authority",
          "fields": [
            {
              "path": "name",
              "label": "Full name",
              "type": "text",
              "required": true
            },
            {
              "path": "identityReference",
              "label": "Verified identity evidence",
              "type": "document-ref",
              "required": true,
              "declaredBy": "customer"
            },
            {
              "path": "authorityLimit",
              "label": "Authority limit (AUD)",
              "type": "currency",
              "visibleWhen": "entity.type = 'company'"
            }
          ],
          "collection": {
            "path": "signatories",
            "min": 1,
            "max": 20
          }
        }
      ]
    },
