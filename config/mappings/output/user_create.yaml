{
  "output": "User_Create.csv",
  "kind": "csv",
  "gate": "cbs",
  "row_source": "people",
  "columns": [
    {
      "name": "CUSTOMER_ID",
      "from": "$record.recordId"
    },
    {
      "name": "NAME",
      "from": "name"
    },
    {
      "name": "DATE_OF_BIRTH",
      "from": "dateOfBirth",
      "transform": "date:DD/MM/YYYY"
    },
    {
      "name": "EMAIL",
      "from": "email"
    },
    {
      "name": "ROLE",
      "from": "role"
    }
  ],
  "order_by": [
    "CUSTOMER_ID"
  ]
}
